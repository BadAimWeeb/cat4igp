# Enrollment and network settings are configured by the administrator.
daemon_socket = "/var/run/cat4igp-client.sock"
data_dir = "/var/lib/cat4igp-client"
# Set true only for direct, unencrypted L2TP.
allow_insecure_l2tp = false

[port_range]
min = 51820
max = 52000 # Exclusive

[tunnel_protocols]
wireguard = true
l2tp = false