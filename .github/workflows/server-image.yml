name: Server image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: bash packaging/check-release-tag.sh --check
      - run: bash packaging/image-tag.sh --check
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}-server"
          tag=$(bash packaging/image-tag.sh)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: [metadata, tests]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
      - name: Check runtime image
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE@$DIGEST" -ec '
            test "$(id -u)" = 10001
            test -w /data
            test -x /usr/bin/cat4igp-server
            test -f /usr/share/licenses/cat4igp/LICENSE
            cat4igp-server migrate
            AUTO_MIGRATE=false cat4igp-server migrate
            output=$(ldd /usr/bin/cat4igp-server 2>&1)
            ! printf "%s" "$output" | grep -E "not found|Error loading|Error relocating"
          '
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: server-digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: server-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          sources=()
          for digest in digests/*; do
            hash=$(basename "$digest")
            [[ $hash =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@sha256:$hash")
          done
          if [[ $REF == refs/tags/* ]]; then
            bash packaging/check-release-tag.sh
          fi
          [[ ${#sources[@]} == 2 ]]
          docker buildx imagetools create -t "$IMAGE:$TAG" "${sources[@]}"