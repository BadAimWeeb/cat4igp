name: Server image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}-server"
          tag=${SHA:0:7}
          if [[ $REF == refs/tags/* ]]; then
            version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' server/Cargo.toml)
            [[ $REF == "refs/tags/v$version" && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tag="v$version"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
      - name: Check runtime image
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE@$DIGEST" -ec '
            test "$(id -u)" = 10001
            test -w /data
            test -x /usr/bin/cat4igp-server
            test -f /usr/share/licenses/cat4igp/LICENSE
            test -n "$(find /usr/share/cat4igp/migrations -name up.sql -print)"
            output=$(ldd /usr/bin/cat4igp-server 2>&1)
            ! printf "%s" "$output" | grep -E "not found|Error loading|Error relocating"
          '
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v6
        with:
          name: server-digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: server-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          sources=()
          for digest in digests/*; do
            hash=$(basename "$digest")
            [[ $hash =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@sha256:$hash")
          done
          [[ ${#sources[@]} == 2 ]]
          docker buildx imagetools create -t "$IMAGE:$TAG" "${sources[@]}"