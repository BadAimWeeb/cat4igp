name: Client packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash packaging/build.sh --check
      - run: cargo test --locked -p cat4igp-client -p cat4igp-shared -p cat4igp-libfec

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: alpine, arch: x86_64, runner: ubuntu-24.04 }
          - { distro: alpine, arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: alpine, arch: riscv64, runner: ubuntu-24.04-riscv }
          - { distro: debian, arch: x86_64, runner: ubuntu-24.04 }
          - { distro: debian, arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: debian, arch: riscv64, runner: ubuntu-24.04-riscv }
          - { distro: arch, arch: x86_64, runner: ubuntu-24.04 }
          - { distro: static, arch: x86_64, runner: ubuntu-24.04 }
          - { distro: static, arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: openwrt, arch: x86_64, runner: ubuntu-24.04 }
          - { distro: openwrt, arch: aarch64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash packaging/build.sh '${{ matrix.distro }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v6
        with:
          name: client-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/${{ matrix.distro }}-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: client-*
          path: packages
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          for directory in packages/client-*; do
            mapfile -t files < <(find "$directory" -maxdepth 1 -type f)
            test "${#files[@]}" -eq 1
            # Prefix prevents Alpine/OpenWrt or ARM/x86 package name collisions.
            cp "${files[0]}" "release/$(basename "$directory")-$(basename "${files[0]}")"
          done
          test "$(find release -type f | wc -l)" -eq 11
          (cd release && sha256sum * > SHA256SUMS)
          gh release create "$TAG" release/* --verify-tag --title "$TAG" --generate-notes