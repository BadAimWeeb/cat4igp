name: Client packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  guard:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: bash packaging/build.sh --check
      - run: bash packaging/check-release-tag.sh --check
      - run: cargo test --locked -p cat4igp-client -p cat4igp-shared -p cat4igp-libfec

  build:
    needs: [guard, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: alpine, arch: x86_64, runner: ubuntu-24.04 }
          - { distro: alpine, arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: alpine, arch: riscv64, runner: ubuntu-24.04-riscv }
          - { distro: debian, arch: x86_64, runner: ubuntu-24.04 }
          - { distro: debian, arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: debian, arch: riscv64, runner: ubuntu-24.04-riscv }
          - { distro: arch, arch: x86_64, runner: ubuntu-24.04 }
          - { distro: static, arch: x86_64, runner: ubuntu-24.04 }
          - { distro: static, arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: openwrt, arch: x86_64, runner: ubuntu-24.04 }
          - { distro: openwrt, arch: aarch64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: bash packaging/build.sh '${{ matrix.distro }}' '${{ matrix.arch }}'
      - name: Attest matrix outputs
        id: provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/${{ matrix.distro }}-${{ matrix.arch }}/*
      - name: Include build attestation
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TARGET: ${{ matrix.distro }}-${{ matrix.arch }}
        run: cp "$BUNDLE" "dist/$TARGET/BUILD-PROVENANCE.jsonl"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: client-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/${{ matrix.distro }}-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: client-*
          path: packages
      - name: Assemble complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          mkdir release
          expected=(
            client-alpine-x86_64 client-alpine-aarch64 client-alpine-riscv64
            client-debian-x86_64 client-debian-aarch64 client-debian-riscv64
            client-arch-x86_64 client-static-x86_64 client-static-aarch64
            client-openwrt-x86_64 client-openwrt-aarch64
          )
          for name in "${expected[@]}"; do
            test -d "packages/$name"
          done
          test "$(find packages -mindepth 1 -maxdepth 1 | wc -l)" -eq "${#expected[@]}"
          for directory in packages/client-*; do
            mapfile -t files < <(find "$directory" -maxdepth 1 -type f ! -name BUILD-DEPENDENCIES.txt ! -name BUILD-PROVENANCE.jsonl)
            test "${#files[@]}" -eq 1
            test -f "$directory/BUILD-DEPENDENCIES.txt"
            test -f "$directory/BUILD-PROVENANCE.jsonl"
            # ponytail: RISC-V currently builds on RISE self-hosted runners; replace
            # this exception when a trusted GitHub-hosted build path is available.
            runner_policy=(--deny-self-hosted-runners)
            case "$(basename "$directory")" in
              client-alpine-riscv64|client-debian-riscv64) runner_policy=() ;;
            esac
            for artifact in "${files[0]}" "$directory/BUILD-DEPENDENCIES.txt"; do
              gh attestation verify "$artifact" --repo "$GH_REPO" \
                --bundle "$directory/BUILD-PROVENANCE.jsonl" \
                --signer-workflow "$GH_REPO/.github/workflows/packages.yml" \
                --source-digest "$SOURCE_SHA" --source-ref "$SOURCE_REF" \
                "${runner_policy[@]}"
            done
            # Prefix prevents Alpine/OpenWrt or ARM/x86 package name collisions.
            cp "${files[0]}" "release/$(basename "$directory")-$(basename "${files[0]}")"
            cp "$directory/BUILD-DEPENDENCIES.txt" "release/$(basename "$directory")-BUILD-DEPENDENCIES.txt"
            cp "$directory/BUILD-PROVENANCE.jsonl" "release/$(basename "$directory")-BUILD-PROVENANCE.jsonl"
          done
          test "$(find release -type f | wc -l)" -eq 33
          (cd release && sha256sum * > SHA256SUMS)
      - name: Attest release artifacts
        id: release-provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bash packaging/check-release-tag.sh
          gh release create "$TAG" release/* --verify-tag --draft --title "$TAG" --generate-notes
      - name: Verify downloaded release and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.release-provenance.outputs.bundle-path }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download "$TAG" --dir downloaded
          diff -r release downloaded
          (cd downloaded && sha256sum --check SHA256SUMS)
          for artifact in downloaded/*; do
            gh attestation verify "$artifact" --repo "$GH_REPO" \
              --bundle "$BUNDLE" \
              --signer-workflow "$GH_REPO/.github/workflows/packages.yml" \
              --source-digest "$SOURCE_SHA" --source-ref "$SOURCE_REF" \
              --deny-self-hosted-runners
          done
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bash packaging/check-release-tag.sh
          gh release edit "$TAG" --draft=false
      - name: Prepare signed Pages repositories
        if: vars.PUBLISH_PACKAGE_FEEDS == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: BadAimWeeb/cat4igp-repo
          ref: main
          path: pages-repository
          token: ${{ secrets.PACKAGE_PAGES_TOKEN }}
          persist-credentials: false
      - name: Install repository indexing tools
        if: vars.PUBLISH_PACKAGE_FEEDS == 'true'
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Sign verified packages and publish Pages source
        if: vars.PUBLISH_PACKAGE_FEEDS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PAGES_GPG_FINGERPRINT: ${{ vars.PACKAGE_GPG_FINGERPRINT }}
          GPG_SECRET: ${{ secrets.PACKAGE_GPG_SECRET }}
          ALPINE_SECRET: ${{ secrets.PACKAGE_ALPINE_RSA_KEY }}
          SOURCE_SHA: ${{ github.sha }}
          OPENWRT_SECRET: ${{ secrets.PACKAGE_OPENWRT_KEY }}
        run: |
          set -euo pipefail
          bash packaging/check-release-tag.sh
          umask 077
          keys=$(mktemp -d)
          trap 'rm -rf "$keys"' EXIT
          mkdir "$keys/gnupg"
          export GNUPGHOME="$keys/gnupg"
          export ALPINE_SIGNING_KEY="$keys/alpine.rsa" OPENWRT_SIGNING_KEY="$keys/openwrt.pem"
          printf '%s\n' "$GPG_SECRET" | gpg --batch --import
          printf '%s\n' "$ALPINE_SECRET" > "$ALPINE_SIGNING_KEY"
          printf '%s\n' "$OPENWRT_SECRET" > "$OPENWRT_SIGNING_KEY"
          unset GPG_SECRET ALPINE_SECRET OPENWRT_SECRET
          bash packaging/pages-repositories.sh packages pages-repository/docs "$TAG"
      - name: Push Pages source
        if: vars.PUBLISH_PACKAGE_FEEDS == 'true'
        working-directory: pages-repository
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_PAGES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'cat4igp release automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs
          git commit -m "Publish CAT4IGP $TAG package feeds"
          git -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/main