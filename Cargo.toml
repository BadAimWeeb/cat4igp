[workspace]
members = ["client", "server", "shared", "libfec"]
resolver = "3"

[workspace.dependencies]
cat4igp-shared = { path = "shared" }
cat4igp-client = { path = "client" }
cat4igp-server = { path = "server" }
cat4igp-libfec = { path = "libfec" }
chrono = { version = "0.4.44", features = ["serde"] }
libp2p = { version = "0.57.0", default-features = false, features = ["ed25519", "gossipsub", "json", "macros", "noise", "pnet", "request-response", "tcp", "tokio", "yamux"] }
